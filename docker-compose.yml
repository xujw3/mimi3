services:
  mimi3:
    image: kingxujw/mimi3:latest
    pull_policy: always
    container_name: mimi3
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./users:/app/users
      - ./logs:/app/logs
      - ./data:/app/data
